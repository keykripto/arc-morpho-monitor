<body>

<div class="container">

    <div class="card">

        <h1>Arc Morpho Market Monitor</h1>

        <div class="pair">
            USDC / cirBTC
        </div>

        <div class="liquidity-label">
            Available Market Liquidity
        </div>

        <div id="liquidity" class="liquidity">
            Loading...
        </div>

        <div id="status" class="status">
            Checking market...
        </div>

        <div class="row">
            <span>Total Market Liquidity</span>
            <span id="marketLiquidity" class="value">-</span>
        </div>

        <div class="row">
            <span>Reallocatable Liquidity</span>
            <span id="reallocatable" class="value">-</span>
        </div>

        <div class="row">
            <span>Last Indexed Block</span>
            <span id="block" class="value">-</span>
        </div>

        <div class="row">
            <span>Last Check</span>
            <span id="lastCheck" class="value">-</span>
        </div>

        <button onclick="requestNotificationPermission()">
            🔔 Bildirimleri Aç
        </button>

        <div class="small">
            Otomatik kontrol: 30 saniye
        </div>

    </div>

</div>

<script>

    // ==========================================
    // MORPHO MARKET
    // ==========================================

    const CHAIN_ID = 5042;

    const MARKET_ID =
        "0xc2db905f174e5defcce01d321b09f15f78856a36a21b90cc7e1abbc29225815d";

    const API_URL =
        `https://api.morpho.org/v0/blue/markets/${CHAIN_ID}:${MARKET_ID}/liquidity`;

    const USDC_DECIMALS = 6;

    let previousLiquidity = null;


    // ==========================================
    // FORMAT USDC
    // ==========================================

    function formatUSDC(rawValue) {

        const value =
            Number(rawValue) / Math.pow(10, USDC_DECIMALS);

        return new Intl.NumberFormat("en-US", {
            style: "currency",
            currency: "USD",
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(value);
    }


    // ==========================================
    // CHECK MARKET
    // ==========================================

    async function checkMarket() {

        const liquidityElement =
            document.getElementById("liquidity");

        const statusElement =
            document.getElementById("status");

        try {

            const response = await fetch(API_URL, {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    "API error: " + response.status
                );
            }

            const result = await response.json();

            const data = result.data;

            const rawLiquidity =
                data.market_liquidity || "0";

            const rawReallocatable =
                data.reallocatable_liquidity || "0";

            const liquidity =
                Number(rawLiquidity) /
                Math.pow(10, USDC_DECIMALS);


            // ======================================
            // DISPLAY
            // ======================================

            liquidityElement.innerText =
                formatUSDC(rawLiquidity);

            document.getElementById(
                "marketLiquidity"
            ).innerText =
                formatUSDC(rawLiquidity);

            document.getElementById(
                "reallocatable"
            ).innerText =
                formatUSDC(rawReallocatable);

            document.getElementById(
                "block"
            ).innerText =
                data.last_indexed_block || "-";

            document.getElementById(
                "lastCheck"
            ).innerText =
                new Date().toLocaleTimeString();


            // ======================================
            // STATUS
            // ======================================

            if (liquidity > 0) {

                statusElement.innerText =
                    "🟢 LIQUIDITY AVAILABLE";

                statusElement.className =
                    "status available";

            } else {

                statusElement.innerText =
                    "🔴 NO LIQUIDITY";

                statusElement.className =
                    "status empty";
            }


            // ======================================
            // NOTIFICATION
            // ======================================

            if (
                previousLiquidity !== null &&
                previousLiquidity <= 0 &&
                liquidity > 0
            ) {

                sendNotification(liquidity);
            }

            previousLiquidity = liquidity;

        }

        catch (error) {

            console.error(error);

            liquidityElement.innerText =
                "API Error";

            statusElement.innerText =
                "🟠 API bağlantısı başarısız";

            statusElement.className =
                "status error";

            document.getElementById(
                "lastCheck"
            ).innerText =
                new Date().toLocaleTimeString();
        }
    }


    // ==========================================
    // NOTIFICATION PERMISSION
    // ==========================================

    async function requestNotificationPermission() {

        if (!("Notification" in window)) {

            alert(
                "Bu tarayıcı bildirimleri desteklemiyor."
            );

            return;
        }

        const permission =
            await Notification.requestPermission();

        if (permission === "granted") {

            new Notification(
                "Morpho Monitor aktif",
                {
                    body:
                        "Arc USDC/cirBTC marketi izleniyor."
                }
            );
        }
    }


    // ==========================================
    // SEND NOTIFICATION
    // ==========================================

    function sendNotification(liquidity) {

        const message =
            `Arc USDC/cirBTC marketinde ` +
            `${formatUSDC(liquidity)} ` +
            `likidite mevcut.`;

        if (
            "Notification" in window &&
            Notification.permission === "granted"
        ) {

            new Notification(
                "🟢 Morpho'da Likidite Geldi!",
                {
                    body: message
                }
            );
        }

        alert(
            "🟢 LIQUIDITY AVAILABLE!\n\n" +
            message
        );
    }


    // ==========================================
    // FIRST CHECK
    // ==========================================

    checkMarket();


    // ==========================================
    // AUTO REFRESH
    // 30 SECONDS
    // ==========================================

    setInterval(
        checkMarket,
        30 * 1000
    );

</script>

</body>
</html>
